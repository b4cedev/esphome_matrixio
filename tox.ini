[tox]
env_list = py{312,313}-esphome{Target,Curr}

[testenv]
description = run esphome tests
packages = "esphome_ci"
deps =
    esphomeTarget : esphome>=2026.9.1,<2026.9.2
    esphomeCurr   : esphome

commands =
    python3 -m esphome_ci list
    python3 -m esphome_ci lint
    python3 -m esphome_ci test


[gh-actions]
python =
    3.12: py312
    3.13: py313

[gh-actions:env]
ESPHOME =
    target: esphomeTarget
    latest: esphomeCurr
