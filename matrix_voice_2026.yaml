# Test configuration for the ESPHome 2026 port (native API audio).
# Functionally equal to the matrix_voice.yaml that runs on ESPHome 2023.11.6, but
# without the UDP-only workarounds (no sdkconfig mailbox, no idle timeout number).
#
# Keep the node name and do NOT add `api: encryption:` for the first test:
# Home Assistant matches the device by MAC address and stores an encryption key,
# which would block going back to the unencrypted 2023 firmware.
external_components:
  #- source:
  #    type: git
  #    url: https://github.com/gnumpi/esphome_matrixio
  #    ref: main
  - source:
      type: local
      path: esphome/components/

esphome:
  name: matrixio-voice

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

logger:

ota:
  - platform: esphome

api:

spi:
  clk_pin:  GPIO32
  mosi_pin: GPIO33
  miso_pin: GPIO21

matrixio:
  id: matrixio_dev
  cs_pin: GPIO23

light:
  - platform: matrixio
    name: everloop
    id: everloop

microphone:
  - platform: matrixio
    id: matrixio_mic

speaker:
  - platform: matrixio
    id: matrixio_speaker
    # Output and volume are set at runtime by the "Audio output" select and the "Speaker volume" number below.

select:
  # Headphone jack or the speaker connectors (class-D amplifier), only one is active at a time
  - platform: template
    name: "Audio output"
    id: audio_output
    entity_category: config
    options:
      - Headphone
      - Speakers
    initial_option: Headphone
    optimistic: true
    restore_value: true
    # Only on a change from HA, not on boot: start the new output at a safe volume, HA shows the slider jump.
    # Runs before on_value, so the volume is already down when the output switches.
    set_action:
      - number.set:
          id: speaker_volume
          value: 30
    on_value:
      # fires on boot (restored value) and on every change from HA
      - lambda: |-
          id(matrixio_speaker).set_output(x == "Speakers" ? matrixio::kSpeaker : matrixio::kHeadPhone);

number:
  - platform: template
    name: "Speaker volume"
    id: speaker_volume
    unit_of_measurement: "%"
    mode: slider
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 90
    optimistic: true
    restore_value: true
    on_value:
      # fires on boot (restored value) and on every change from HA
      - lambda: id(matrixio_speaker).set_volume(x / 100.0f);

  # Playback ends (LED/wake word come back) this long after the last audio.
  # Too low can cut off a response when the stream stalls (WiFi, slow TTS).
  - platform: template
    name: "Speaker idle timeout"
    id: speaker_idle_timeout
    entity_category: config
    unit_of_measurement: ms
    mode: box
    min_value: 100
    max_value: 5000
    step: 50
    initial_value: 500
    optimistic: true
    restore_value: true
    on_value:
      # fires on boot (restored value) and on every change from HA
      - lambda: id(matrixio_speaker).set_idle_timeout((uint32_t) x);

globals:
  # true from the wake word until the end of the voice assistant turn
  - id: turn_active
    type: bool
    restore_value: no
    initial_value: 'false'

# Workaround for a Home Assistant bug: HA creates the TTS stream when the wake word pipeline starts and deletes it
# after tts `time_memory` (300 s) without use. If the wake word comes later, the stream is gone, HA does not stream
# the answer and the Voice stays silent. Restarting the idle pipeline more often than that gives it a fresh stream.
interval:
  - interval: 4min
    then:
      - if:
          condition:
            and:
              - switch.is_on: use_wake_word
              - lambda: 'return !id(turn_active);'
              - voice_assistant.connected:
          then:
            - voice_assistant.stop:
            - delay: 1s
            - voice_assistant.start_continuous:

voice_assistant:
  id: va
  microphone:
    microphone: matrixio_mic
    # The microphone is very quiet (speech at -42..-50 dBFS RMS, peaks at -22..-30 dBFS, measured on the audio Home
    # Assistant received). Speech to text and the wake word work better with a normal level: +12 dB, peaks stay below
    # -9 dBFS.
    gain_factor: 4
  speaker: matrixio_speaker

  on_listening:
    - lambda: id(turn_active) = true;
    - light.turn_on:
        id: everloop
        blue: 100%
        red: 0%
        green: 0%
        white: 0%
        brightness: 60%
  on_stt_vad_end:
    - light.turn_on:
        id: everloop
        blue: 50%
        red: 0%
        green: 100%
        white: 0%
        brightness: 60%
  on_tts_start:
    - light.turn_on:
        id: everloop
        blue: 100%
        red: 100%
        green: 0%
        white: 0%
        brightness: 60%
  on_end:
    - delay: 100ms
    - wait_until:
        not:
          speaker.is_playing:
    - lambda: id(turn_active) = false;
    - script.execute: reset_led
  on_error:
    - lambda: id(turn_active) = false;
    - light.turn_on:
        id: everloop
        red: 100%
        green: 0%
        blue: 0%
        white: 0%
        brightness: 60%
    - delay: 1s
    - script.execute: reset_led
  on_client_connected:
    - if:
        condition:
          switch.is_on: use_wake_word
        then:
          - voice_assistant.start_continuous:
          - script.execute: reset_led
  on_client_disconnected:
    - if:
        condition:
          switch.is_on: use_wake_word
        then:
          - voice_assistant.stop:
          - light.turn_off: everloop

script:
  - id: reset_led
    then:
      - if:
          condition:
            - switch.is_on: use_wake_word
            - switch.is_on: use_listen_light
          then:
            - light.turn_on:
                id: everloop
                red: 100%
                green: 89%
                blue: 71%
                white: 0%
                brightness: 60%
          else:
            - light.turn_off: everloop

switch:
  - platform: template
    name: 'Use wake word'
    id: use_wake_word
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - lambda: id(va).set_use_wake_word(true);
      - if:
          condition:
            not:
              - voice_assistant.is_running
          then:
            - voice_assistant.start_continuous
      - script.execute: reset_led
    on_turn_off:
      - voice_assistant.stop
      - lambda: id(va).set_use_wake_word(false);
      - script.execute: reset_led
  - platform: template
    name: 'Use Listen Light'
    id: use_listen_light
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: reset_led
    on_turn_off:
      - script.execute: reset_led

  - platform: template
    name: "Start Listening"
    turn_on_action:
      - voice_assistant.start:
          silence_detection: false

    turn_off_action:
      - voice_assistant.stop:
      - script.execute: reset_led
