# Test configuration for the ESPHome 2026 port (native API audio).
# Functionally equal to the matrix_voice.yaml that runs on ESPHome 2023.11.6, but
# without the UDP-only workarounds (no sdkconfig mailbox, no idle timeout number).
#
# Keep the node name and do NOT add `api: encryption:` for the first test:
# Home Assistant matches the device by MAC address and stores an encryption key,
# which would block going back to the unencrypted 2023 firmware.
substitutions:
  # Everloop ring size
  led_count: '18'
  # Phases of the voice assistant, as in the Home Assistant Voice PE
  voice_assist_idle_phase_id: '1'
  voice_assist_waiting_for_command_phase_id: '2'
  voice_assist_listening_for_command_phase_id: '3'
  voice_assist_thinking_phase_id: '4'
  voice_assist_replying_phase_id: '5'
  voice_assist_not_ready_phase_id: '10'
  voice_assist_error_phase_id: '11'

external_components:
  #- source:
  #    type: git
  #    url: https://github.com/gnumpi/esphome_matrixio
  #    ref: main
  - source:
      type: local
      path: esphome/components/

esphome:
  name: matrixio-voice
  on_boot:
    # The direction beam on the ring is shown from on_listening until on_end
    - lambda: id(matrixio_mic).set_beam_enabled(false);
    - script.execute: control_leds

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  on_connect:
    - script.execute: control_leds
  on_disconnect:
    - script.execute: control_leds

logger:

ota:
  - platform: esphome

api:
  id: api_id

spi:
  clk_pin:  GPIO32
  mosi_pin: GPIO33
  miso_pin: GPIO21

matrixio:
  id: matrixio_dev
  cs_pin: GPIO23

light:
  # The LED ring of the Voice. Not used directly, the two lights below show on it.
  - platform: matrixio
    name: Everloop
    id: leds_internal
    internal: true

  # Shows the voice assistant states with the animations of the Home Assistant Voice PE. Not exposed, the device
  # controls it.
  - platform: partition
    id: voice_assistant_leds
    internal: true
    default_transition_length: 0ms
    segments:
      - id: leds_internal
        from: 0
        to: 17
    effects:
      - addressable_lambda:
          name: "Waiting for Command"
          update_interval: 100ms
          lambda: |-
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255, light_color.get_blue() * 255);
            const int n = ${led_count};
            const int h = n / 2;
            const int idx = id(global_led_animation_index);
            for (int i = 0; i < n; i++) {
              if (i == idx % n) {
                it[i] = color;
              } else if (i == (idx + n - 1) % n) {
                it[i] = color * 192;
              } else if (i == (idx + n - 2) % n) {
                it[i] = color * 128;
              } else if (i == (idx + h) % n) {
                it[i] = color;
              } else if (i == (idx + h - 1) % n) {
                it[i] = color * 192;
              } else if (i == (idx + h - 2) % n) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
            id(global_led_animation_index) = (idx + 1) % n;
      - addressable_lambda:
          name: "Listening For Command"
          update_interval: 50ms
          lambda: |-
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255, light_color.get_blue() * 255);
            const int n = ${led_count};
            const int h = n / 2;
            const int idx = id(global_led_animation_index);
            for (int i = 0; i < n; i++) {
              if (i == idx % n) {
                it[i] = color;
              } else if (i == (idx + n - 1) % n) {
                it[i] = color * 192;
              } else if (i == (idx + n - 2) % n) {
                it[i] = color * 128;
              } else if (i == (idx + h) % n) {
                it[i] = color;
              } else if (i == (idx + h - 1) % n) {
                it[i] = color * 192;
              } else if (i == (idx + h - 2) % n) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
            id(global_led_animation_index) = (idx + 1) % n;
      - addressable_lambda:
          name: "Thinking"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255, light_color.get_blue() * 255);
            const int n = ${led_count};
            const int h = n / 2;
            for (int i = 0; i < n; i++) {
              if (i == id(global_led_animation_index) % n || i == (id(global_led_animation_index) + h) % n) {
                it[i] = color * uint8_t(255 / brightness_step_number * (brightness_step_number - brightness_step));
              } else {
                it[i] = Color::BLACK;
              }
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      - addressable_lambda:
          name: "Replying"
          update_interval: 50ms
          lambda: |-
            const int n = ${led_count};
            const int h = n / 2;
            id(global_led_animation_index) = (n + id(global_led_animation_index) - 1) % n;
            const int idx = id(global_led_animation_index);
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255, light_color.get_blue() * 255);
            for (int i = 0; i < n; i++) {
              if (i == idx % n) {
                it[i] = color;
              } else if (i == (idx + 1) % n) {
                it[i] = color * 192;
              } else if (i == (idx + 2) % n) {
                it[i] = color * 128;
              } else if (i == (idx + h) % n) {
                it[i] = color;
              } else if (i == (idx + h + 1) % n) {
                it[i] = color * 192;
              } else if (i == (idx + h + 2) % n) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
      - addressable_twinkle:
          name: "Twinkle"
          twinkle_probability: 50%
      - addressable_lambda:
          name: "Error"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            Color error_color(255, 0, 0);
            for (int i = 0; i < ${led_count}; i++) {
              it[i] = error_color * uint8_t(255 / brightness_step_number * (brightness_step_number - brightness_step));
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }

  # The light the user controls in Home Assistant: its colour and brightness are used by the animations, and when it
  # is on the ring glows in this colour while the voice assistant is idle (off by default).
  - platform: partition
    id: led_ring
    name: LED Ring
    entity_category: config
    icon: "mdi:circle-outline"
    default_transition_length: 0ms
    restore_mode: RESTORE_DEFAULT_OFF
    initial_state:
      color_mode: rgb
      brightness: 66%
      red: 9.4%
      green: 73.3%
      blue: 94.9%
    segments:
      - id: leds_internal
        from: 0
        to: 17

microphone:
  - platform: matrixio
    id: matrixio_mic
    # Direction of arrival of sound (uses all 8 microphones, the voice assistant still gets mono).
    # The sensors work all the time, with the more lenient detect_* thresholds, e.g. for presence.
    direction:
      always_on: true
      beam_light: leds_internal
      angle:
        name: "Sound direction"
      confidence:
        name: "Sound direction confidence"
        entity_category: diagnostic
      level:
        name: "Sound level over background"
        entity_category: diagnostic
      active:
        name: "Sound detected"

speaker:
  - platform: matrixio
    id: matrixio_speaker_hp
    # [headphone,speakers], default: headphone
    audio_out: headphone
    # 0..100, in percent, default: 80
    volume: 90

number:
  # Playback ends (LED/wake word come back) this long after the last audio.
  # Too low can cut off a response when the stream stalls (WiFi, slow TTS).
  - platform: template
    name: "Speaker idle timeout"
    id: speaker_idle_timeout
    entity_category: config
    unit_of_measurement: ms
    mode: box
    min_value: 100
    max_value: 5000
    step: 50
    initial_value: 500
    optimistic: true
    restore_value: true
    on_value:
      # fires on boot (restored value) and on every change from HA
      - lambda: id(matrixio_speaker_hp).set_idle_timeout((uint32_t) x);

  # Sensitivity of the direction beam on the ring (the sensors use detect_confidence/detect_level_db)
  - platform: template
    name: "Direction beam confidence"
    id: direction_beam_confidence
    entity_category: config
    mode: box
    min_value: 0.2
    max_value: 0.95
    step: 0.01
    initial_value: 0.62
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(matrixio_mic).set_beam_confidence(x);
  - platform: template
    name: "Direction beam level over background"
    id: direction_beam_level
    entity_category: config
    unit_of_measurement: dB
    mode: box
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 9
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(matrixio_mic).set_beam_level_db(x);

globals:
  # true from the wake word until the end of the voice assistant turn
  - id: turn_active
    type: bool
    restore_value: no
    initial_value: 'false'
  # true until the voice assistant has connected to Home Assistant for the first time
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  # phase of the voice assistant, shown by the LED ring
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${voice_assist_not_ready_phase_id}
  # position of the animations on the ring
  - id: global_led_animation_index
    type: int
    restore_value: no
    initial_value: '0'

# Workaround for a Home Assistant bug: HA creates the TTS stream when the wake word pipeline starts and deletes it
# after tts `time_memory` (300 s) without use. If the wake word comes later, the stream is gone, HA does not stream
# the answer and the Voice stays silent. Restarting the idle pipeline more often than that gives it a fresh stream.
interval:
  - interval: 4min
    then:
      - if:
          condition:
            and:
              - switch.is_on: use_wake_word
              - lambda: 'return !id(turn_active);'
              - voice_assistant.connected:
          then:
            - voice_assistant.stop:
            - delay: 1s
            - voice_assistant.start_continuous:

voice_assistant:
  id: va
  microphone: matrixio_mic
  speaker: matrixio_speaker_hp

  # The ring follows the phases of the Home Assistant Voice PE
  on_listening:
    - lambda: id(matrixio_mic).set_beam_enabled(true);
    - lambda: |-
        id(turn_active) = true;
        id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_end:
    # the beam stays on the direction of the speaker, but no longer follows the answer from the speaker
    - lambda: id(matrixio_mic).set_beam_tracking(false);
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: control_leds
  on_intent_progress:
    - if:
        condition:
          lambda: 'return !x.empty();'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
  on_tts_start:
    - if:
        condition:
          lambda: 'return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
  on_end:
    - lambda: id(matrixio_mic).set_beam_enabled(false);
    - delay: 100ms
    - wait_until:
        not:
          speaker.is_playing:
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    - lambda: |-
        id(turn_active) = false;
        id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_error:
    - lambda: id(matrixio_mic).set_beam_enabled(false);
    - lambda: id(turn_active) = false;
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: control_leds
  on_client_connected:
    - lambda: |-
        id(init_in_progress) = false;
        id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - if:
        condition:
          switch.is_on: use_wake_word
        then:
          - voice_assistant.start_continuous:
    - script.execute: control_leds
  on_client_disconnected:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - if:
        condition:
          switch.is_on: use_wake_word
        then:
          - voice_assistant.stop:
    - script.execute: control_leds

script:
  # Master script of the LED ring, as in the Voice PE: called whenever the connection or the phase changes
  - id: control_leds
    then:
      - lambda: |-
          if (id(init_in_progress)) {
            id(control_leds_init_state).execute();
          } else if (!id(wifi_id).is_connected() || !id(api_id).is_connected()) {
            id(control_leds_no_ha_connection_state).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_waiting_for_command_phase_id}) {
            id(control_leds_waiting_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_listening_for_command_phase_id}) {
            id(control_leds_listening_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_thinking_phase_id}) {
            id(control_leds_thinking_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_replying_phase_id}) {
            id(control_leds_replying_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_error_phase_id}) {
            id(control_leds_error_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_not_ready_phase_id}) {
            id(control_leds_not_ready_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_idle_phase_id}) {
            id(control_leds_idle_phase).execute();
          }

  # Starting up: blue twinkle if WiFi is connected, else solid warm white
  - id: control_leds_init_state
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - light.turn_on:
                brightness: 66%
                red: 9.4%
                green: 73.3%
                blue: 94.9%
                id: voice_assistant_leds
                effect: "Twinkle"
          else:
            - light.turn_on:
                brightness: 66%
                red: 100%
                green: 89%
                blue: 71%
                id: voice_assistant_leds
                effect: "none"

  # No connection to Home Assistant: red twinkle
  - id: control_leds_no_ha_connection_state
    then:
      - light.turn_on:
          brightness: 66%
          red: 100%
          green: 0%
          blue: 0%
          id: voice_assistant_leds
          effect: "Twinkle"

  # Idle: nothing, or the colour of the LED Ring light if the user turned it on
  - id: control_leds_idle_phase
    then:
      - light.turn_off: voice_assistant_leds
      - if:
          condition:
            light.is_on: led_ring
          then:
            - light.turn_on: led_ring

  # After the wake word: slow clockwise spin
  - id: control_leds_waiting_for_command_phase
    then:
      - light.turn_on:
          brightness: !lambda return max(id(led_ring).current_values.get_brightness(), 0.2f);
          id: voice_assistant_leds
          effect: "Waiting for Command"

  # The user speaks: fast clockwise spin
  - id: control_leds_listening_for_command_phase
    then:
      - light.turn_on:
          brightness: !lambda return max(id(led_ring).current_values.get_brightness(), 0.2f);
          id: voice_assistant_leds
          effect: "Listening For Command"

  # Thinking: the spin stops, the two opposite LEDs where it stopped pulse
  - id: control_leds_thinking_phase
    then:
      - light.turn_on:
          brightness: !lambda return max(id(led_ring).current_values.get_brightness(), 0.2f);
          id: voice_assistant_leds
          effect: "Thinking"

  # Answer: fast anticlockwise spin
  - id: control_leds_replying_phase
    then:
      - light.turn_on:
          brightness: !lambda return max(id(led_ring).current_values.get_brightness(), 0.2f);
          id: voice_assistant_leds
          effect: "Replying"

  # Error: fast red pulse
  - id: control_leds_error_phase
    then:
      - light.turn_on:
          brightness: !lambda return min(max(id(led_ring).current_values.get_brightness(), 0.2f) + 0.1f, 1.0f);
          red: 100%
          green: 0%
          blue: 0%
          id: voice_assistant_leds
          effect: "Error"

  # Not ready: red twinkle
  - id: control_leds_not_ready_phase
    then:
      - light.turn_on:
          brightness: 66%
          red: 100%
          green: 0%
          blue: 0%
          id: voice_assistant_leds
          effect: "Twinkle"

switch:
  - platform: template
    name: 'Use wake word'
    id: use_wake_word
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - lambda: id(va).set_use_wake_word(true);
      - if:
          condition:
            not:
              - voice_assistant.is_running
          then:
            - voice_assistant.start_continuous
      - script.execute: control_leds
    on_turn_off:
      - voice_assistant.stop
      - lambda: id(va).set_use_wake_word(false);
      - script.execute: control_leds
  - platform: template
    name: "Start Listening"
    turn_on_action:
      - voice_assistant.start:
          silence_detection: false

    turn_off_action:
      - voice_assistant.stop:
      - script.execute: control_leds
